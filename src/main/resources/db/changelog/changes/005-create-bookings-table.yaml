databaseChangeLog:
  - changeSet:
      id: 005-create-bookings-table
      author: siarhei
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: user_telegram_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: varchar(200)
              - column:
                  name: activity_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_activity
                    referencedTableName: activities
                    referencedColumnNames: id
              - column:
                  name: participants_count
                  type: integer
                  defaultValue: 1
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: CONFIRMED
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: decimal(10,2)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_user_telegram
            columns:
              - column:
                  name: user_telegram_id
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_activity
            columns:
              - column:
                  name: activity_id
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_status
            columns:
              - column:
                  name: status
