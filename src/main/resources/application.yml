spring:
  application:
    name: activity-bot
  
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:activitydb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

bot:
  name: ${TELEGRAM_BOT_USERNAME:ActivityBot}
  token: ${TELEGRAM_BOT_TOKEN:test_token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,liquibase
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.github.xmlreader.activitybot: DEBUG
    org.springframework.web: INFO
    org.telegram: INFO
